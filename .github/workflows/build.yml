name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write   # GitHub Release banate lage

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compute version
        run: |
          echo "VC=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VN=1.3.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: >
          gradle assembleRelease --no-daemon
          -PappVersionCode=$VC
          -PgithubRepo=${{ github.repository }}

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "AutoEnhance-v${VN}.apk"

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: AutoEnhance-apk
          path: AutoEnhance-v${{ env.VN }}.apk

      - name: Publish GitHub Release (app eta theke update nibe)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-$VC" "AutoEnhance-v${VN}.apk" \
            --title "v${VN}" \
            --notes "Auto build #${GITHUB_RUN_NUMBER}: $(git log -1 --pretty=%s)" \
            --latest
